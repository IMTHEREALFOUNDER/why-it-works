name: VK connection check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/vk_probe.py
      - .github/workflows/vk-check.yml

permissions:
  contents: read

concurrency:
  group: vk-connection-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check community connection without publishing
        env:
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
        run: python scripts/vk_probe.py
      - name: Save sanitized connection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vk-connection
          path: reports/vk-connection.json
          retention-days: 3
          if-no-files-found: warn
